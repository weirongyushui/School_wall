<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 个人管理系统</title>
    <link type="text/css" rel="stylesheet" href="/css/Register.css">
</head>
<body>
<!-- 导航栏 -->
<div class="navigation-bar">
    <div class="navigation-bar-cell active">
        <a href="#">📝 用户注册</a>
    </div>
    <div class="navigation-bar-cell">
        <a href="/login">🔒 返回登录</a>
    </div>
</div>

<!-- 主容器 -->
<div class="register-container">
    <!-- 注册卡片 -->
    <div class="register-card">
        <div class="card-header">
            <h1>创建账户</h1>
            <p>请填写以下信息完成注册</p>
        </div>
        <div class="card-content">
            <form class="register-form" id="registerForm">
                <!-- 学号输入 -->
                <div class="form-group">
                    <label for="studentId">学号 *</label>
                    <input type="text" id="studentId" name="studentId" placeholder="请输入学号" required>
                    <span class="form-tip">学号为 9 位数字</span>
                </div>
                
                <!-- 用户名输入 -->
                <div class="form-group">
                    <label for="username">用户名 *</label>
                    <input type="text" id="username" name="username" placeholder="请设置用户名，用于登录" required>
                </div>
                
                <!-- 密码输入 -->
                <div class="form-group">
                    <label for="password">密码 *</label>
                    <input type="password" id="password" name="password" placeholder="请设置密码（6-20 个字符）" required>
                </div>
                
                <!-- 确认密码 -->
                <div class="form-group">
                    <label for="confirmPassword">确认密码 *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                </div>
                
                <!-- 昵称（可选） -->
                <div class="form-group">
                    <label for="nickname">昵称</label>
                    <input type="text" id="nickname" name="nickname" placeholder="设置一个昵称吧（可选）">
                </div>
                
                <!-- 邮箱（可选） -->
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱地址（可选）">
                </div>
                
                <!-- 协议 -->
                <div class="form-options">
                    <label class="agree-terms">
                        <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                        <!-- TODO(P3): 新增用户协议页面并替换空链接。 -->
                        <span>我已阅读并同意 <a href="#" class="terms-link">《用户协议》</a></span>
                    </label>
                </div>
                
                <!-- 注册按钮 -->
                <button type="submit" class="register-btn">立即注册</button>
            </form>
        </div>
        <div class="card-footer">
            <p>已有账号？<a href="/login" class="login-link">立即登录</a></p>
        </div>
    </div>
</div>

<script src="/js/register.js"></script>
</body>
</html>
