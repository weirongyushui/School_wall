<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态广场 - 个人管理系统</title>
    <link type="text/css" rel="stylesheet" href="/css/Social.css">
    <script src="/js/social.js" defer></script>
</head>
<body>

<!-- 导航栏 -->
<div class="navigation-bar">
    <div class="navigation-bar-cell active"><a href="/social"><img src="/static/app01/images/首页%20(1).png" alt="">&nbsp;发帖</a></div>
    <div class="navigation-bar-cell"><a href="/user"><img src="/static/app01/images/我的.png" alt="">&nbsp;用户</a></div>
    <div class="navigation-bar-cell"><a href="/social"><img src="/static/app01/images/编辑.png" alt="">&nbsp;动态</a></div>
    <div class="navigation-bar-cell"><a href="/borrow.html"><img src="/static/app01/images/进入.png" alt="">&nbsp;借阅</a></div>
    <div class="navigation-bar-cell"><a target="_blank" href="http://47.94.172.187:8080/">AI</a></div>
    <div class="navigation-bar-cell">
        <a href="javascript:void(0)" onclick="logout()" style="color: #ff4d4f;">
            <img src="/static/app01/images/退出.png" alt="" style="opacity: 0.7;">&nbsp;退出登录
        </a>
    </div>
</div>

<!-- 主容器 -->
<div class="all">

    <!-- 左侧栏 -->
    <div class="left-section">
        <!-- 用户信息卡片 -->
        <div class="user-card">
            <div class="card-header">
                <div class="avatar-placeholder" id="avatarPlaceholder">头</div>
                <div class="user-info">
                    <div id="nickname" class="user-name">加载中...</div>
                    <div id="introduction" class="user-bio">这个人很懒，什么都没写</div>
                </div>
            </div>
            <div class="card-content">
                <div class="info-item">
                    <span class="info-label">学号：</span>
                    <span id="user_id" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">性别：</span>
                    <span id="gender" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">学院/专业：</span>
                    <span id="major" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">年级：</span>
                    <span id="grade" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">微信：</span>
                    <span id="wechat" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">QQ：</span>
                    <span id="qq" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">邮箱：</span>
                    <span id="email" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">电话：</span>
                    <span id="phone" class="info-value">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 中间内容区 -->
    <div class="center-section">
        <!-- 发布框 -->
        <div class="publish-box">
            <div class="publish-header">
                <span class="publish-tip">分享你的想法...</span>
            </div>
            <textarea class="publish-textarea" id="publishContent" placeholder="有什么想和大家分享的？"></textarea>
            <div class="publish-footer">
                <span class="char-count" id="charCount">0 / 200</span>
                <button class="publish-btn" onclick="publish()">发布</button>
            </div>
        </div>

        <!-- 分类标签 -->
        <div class="category-tabs">
            <span class="tab-item active">全部</span>
            <span class="tab-item">发发牢骚</span>
            <span class="tab-item">吹吹牛皮</span>
            <span class="tab-item">校园互助</span>
            <span class="tab-item">联名请愿</span>
        </div>

        <!-- 动态列表 -->
        <div class="feed-list">
            <!-- 动态卡片 1 -->
            <div class="feed-card">
                <div class="feed-header">
                    <div class="feed-author">
                        <div class="author-avatar-placeholder">头</div>
                        <div class="author-info">
                            <span class="author-name">用户名</span>
                            <span class="publish-time">发布时间</span>
                        </div>
                    </div>
                </div>
                <div class="feed-body">
                    <div class="feed-text">动态内容...</div>
                </div>
                <div class="feed-footer">
                    <button class="footer-btn">转发</button>
                    <button class="footer-btn">评论</button>
                    <button class="footer-btn">点赞</button>
                </div>
            </div>

            <!-- 动态卡片 2 -->
            <div class="feed-card">
                <div class="feed-header">
                    <div class="feed-author">
                        <div class="author-avatar-placeholder">头</div>
                        <div class="author-info">
                            <span class="author-name">用户名</span>
                            <span class="publish-time">发布时间</span>
                        </div>
                    </div>
                </div>
                <div class="feed-body">
                    <div class="feed-text">动态内容...</div>
                </div>
                <div class="feed-footer">
                    <button class="footer-btn">转发</button>
                    <button class="footer-btn">评论</button>
                    <button class="footer-btn">点赞</button>
                </div>
            </div>

            <!-- 动态卡片 3 -->
            <div class="feed-card">
                <div class="feed-header">
                    <div class="feed-author">
                        <div class="author-avatar-placeholder">头</div>
                        <div class="author-info">
                            <span class="author-name">用户名</span>
                            <span class="publish-time">发布时间</span>
                        </div>
                    </div>
                </div>
                <div class="feed-body">
                    <div class="feed-text">动态内容...</div>
                </div>
                <div class="feed-footer">
                    <button class="footer-btn">转发</button>
                    <button class="footer-btn">评论</button>
                    <button class="footer-btn">点赞</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧栏 -->
    <div class="right-section">
        <!-- 热搜榜 -->
        <div class="hot-box">
            <div class="hot-header">
                <h3>点赞榜</h3>
            </div>
            <div class="hot-list">
                <div class="hot-item"><span class="hot-rank">1</span><span class="hot-text">热搜内容 1</span></div>
                <div class="hot-item"><span class="hot-rank">2</span><span class="hot-text">热搜内容 2</span></div>
                <div class="hot-item"><span class="hot-rank">3</span><span class="hot-text">热搜内容 3</span></div>
                <div class="hot-item"><span class="hot-rank">4</span><span class="hot-text">热搜内容 4</span></div>
                <div class="hot-item"><span class="hot-rank">5</span><span class="hot-text">热搜内容 5</span></div>
            </div>
        </div>
    </div>

</div>

<script>
    function logout() {
        fetch('/api/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include'
        }).then(function(res) {
            if (res.ok) window.location.href = '/login';
        });
    }

    function publish() {
        var content = document.getElementById('publishContent').value;
        if (!content) {
            alert('请输入内容');
            return;
        }
        alert('发布功能待实现');
    }
</script>
</body>
</html>
