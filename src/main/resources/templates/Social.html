<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态广场 - 个人管理系统</title>
    <link type="text/css" rel="stylesheet" href="/css/Social.css?v=20260922-full-campus-wall">
    <link type="text/css" rel="stylesheet" href="/css/global-background.css?v=20260922-campus-wall">
    <link type="text/css" rel="stylesheet" href="/css/main-navigation.css?v=20260922-unified-nav">
    <link type="text/css" rel="stylesheet" href="/css/campus-theme.css?v=20260922-blue-pink">
    <script src="/js/social.js?v=20260922-parallax-fix" defer></script>
</head>
<body>

<!-- 校园场景视差背景（独立图层，不影响发帖与评论交互） -->
<div class="social-parallax" aria-hidden="true">
    <div class="social-parallax__campus"></div>
    <div class="social-parallax__wash"></div>
    <div class="social-parallax__character">
        <img src="/images/home/campus-guide-character.png" alt="" draggable="false">
    </div>
</div>

<!-- 导航栏 -->
<nav class="navigation-bar" aria-label="主导航">
    <div class="navigation-bar-cell"><a href="#publish">发帖</a></div>
    <div class="navigation-bar-cell"><a href="/user">用户</a></div>
    <div class="navigation-bar-cell active"><a href="#feed" aria-current="page">动态</a></div>
    <div class="navigation-bar-cell"><a href="/borrow.html">借阅</a></div>
    <div class="navigation-bar-cell"><a target="_blank" href="http://47.94.172.187:8080/">AI</a></div>
    <div class="navigation-bar-cell">
        <a class="logout-link" href="#" onclick="logout(); return false;">退出登录</a>
    </div>
</nav>

<!-- 主容器 -->
<div class="all">

    <!-- 左侧栏 -->
    <div class="left-section">
        <!-- 用户信息卡片 -->
        <div class="user-card">
            <div class="card-header">
                <div class="avatar-placeholder" id="avatarPlaceholder">头</div>
                <div class="user-info">
                    <div id="nickname" class="user-name">加载中...</div>
                    <div id="introduction" class="user-bio">这个人很懒，什么都没写</div>
                </div>
            </div>
            <div class="card-content">
                <div class="info-item">
                    <span class="info-label">学号：</span>
                    <span id="user_id" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">性别：</span>
                    <span id="gender" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">学院/专业：</span>
                    <span id="major" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">年级：</span>
                    <span id="grade" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">微信：</span>
                    <span id="wechat" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">QQ：</span>
                    <span id="qq" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">邮箱：</span>
                    <span id="email" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">电话：</span>
                    <span id="phone" class="info-value">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 中间内容区 -->
    <div class="center-section">
        <!-- 发布框 -->
        <div class="publish-box" id="publish">
            <div class="publish-header">
                <span class="publish-tip">分享你的想法...</span>
            </div>
            <!-- 分类选择 + 匿名勾选 -->
            <div class="publish-options">
                <select id="publishCategory" class="publish-select">
                    <option value="1">发发牢骚</option>
                    <option value="2">吹吹牛皮</option>
                    <option value="3">校园互助</option>
                    <option value="4">联名请愿</option>
                </select>
                <label class="anonymous-label">
                    <input type="checkbox" id="publishAnonymous"> 匿名发布
                </label>
            </div>
            <textarea class="publish-textarea" id="publishContent" placeholder="有什么想和大家分享的？"></textarea>
            <div class="publish-footer">
                <span class="char-count" id="charCount">0 / 200</span>
                <button class="publish-btn" id="publishBtn" onclick="publish()">发布</button>
            </div>
        </div>

        <!-- 分类标签 -->
        <div class="category-tabs" id="feed">
            <span class="tab-item active" data-category="0">全部</span>
            <span class="tab-item" data-category="1">发发牢骚</span>
            <span class="tab-item" data-category="2">吹吹牛皮</span>
            <span class="tab-item" data-category="3">校园互助</span>
            <span class="tab-item" data-category="4">联名请愿</span>
            <span class="refresh-btn" onclick="refreshFeed()">🔄 刷新</span>
        </div>

        <!-- 动态列表 -->
        <div class="feed-list" id="feedContainer">
        </div>
        
        <!-- 加载更多 -->
        <div class="load-more" id="loadMore" style="display:none;">
            <button class="load-more-btn" onclick="loadMore()">加载更多</button>
        </div>
    </div>

    <!-- 右侧栏 -->
    <div class="right-section">
        <!-- 点赞榜 -->
        <div class="hot-box">
            <div class="hot-header">
                <h3>点赞榜</h3>
            </div>
            <div class="hot-list" id="hotList">
            </div>
        </div>
    </div>

</div>

<script>
    function logout() {
        fetch('/api/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include'
        }).then(function(res) {
            if (res.ok) window.location.href = '/login';
        });
    }
</script>
</body>
</html>
